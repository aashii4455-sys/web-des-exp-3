<!DOCTYPE html>
<html>
<head>
<title>HTML Elements</title>
</head>
<body>
<h1>HTML Elements</h1>
<h2>Table</h2>
<table border="1">
<tr><th>Name</th><th>Marks</th></tr>
<tr><td>Aman</td><td>85</td></tr>
<tr><td>Rahul</td><td>90</td></tr>
</table>
<h2>Link</h2>
<a href="https://www.google.com">Visit Google</a>

<h2>Image</h2>
<img src="photo.jpg" width="150" alt="Sample Image">
<h2>Frame</h2>
<iframe src="page.html" width="300" height="150" title="My Frame"></iframe>
</body>
</html>
